<!doctype html><html lang="en"><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>FSY responsive verification</title></head><body style="margin:0;background:#ddd"><label>Viewport <select id="width"><option>390</option><option>768</option><option>1366</option><option>1920</option></select></label><label>Workspace <select id="view"><option>headcount</option><option>overview</option><option>access</option><option>food</option></select></label><label>Role <select id="role"><option>assistant_coordinator</option><option>coordinator</option><option>logistics_admin</option><option>session_director</option><option>committee_viewer</option></select></label><iframe title="Verification app" id="app" style="display:block;height:860px;border:0;width:390px"></iframe><script>const frame=document.getElementById('app');function update(){frame.style.width=document.getElementById('width').value+'px';frame.src='./workspace.html?view='+document.getElementById('view').value+'&role='+document.getElementById('role').value;}document.querySelectorAll('select').forEach(e=>e.onchange=update);update();</script></body></html>

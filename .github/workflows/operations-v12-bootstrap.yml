name: Apply operations reliability v12

on:
  push:
    branches:
      - refine/operations-reliability-v12

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[v12-bootstrap]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refine/operations-reliability-v12
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply v12 patch set
        run: python3 scripts/apply-operations-reliability-v12.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Run app tests
        run: npm test
      - name: Run Sites tests
        run: npm run test:sites
      - name: Commit generated release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build operations reliability v12" || exit 0
          git push origin HEAD:refine/operations-reliability-v12

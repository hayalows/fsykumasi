name: Apply Housing UX v13

on:
  push:
    branches:
      - refine/housing-ux-v13-ship

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refine/housing-ux-v13-ship
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Housing UX v13
        run: python scripts/apply-housing-ux-v13.py
      - name: Verify generated source
        run: |
          npm ci
          npm run build
          npm test
          npm run test:sites
      - name: Commit generated refinement
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src public tests
          git commit -m "Apply Housing UX v13 refinement"
          git push origin HEAD:refine/housing-ux-v13-ship

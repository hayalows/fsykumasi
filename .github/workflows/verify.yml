name: Verify FSY Operations

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Upload verified frontend build
        uses: actions/upload-artifact@v4
        with:
          name: fsy-kumasi-frontend
          path: dist/client
          if-no-files-found: error
          retention-days: 7
      - name: Package source for implementation handoff
        run: tar -czf fsy-kumasi-source.tgz --exclude=node_modules --exclude=dist --exclude=.git .
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: fsy-kumasi-source
          path: fsy-kumasi-source.tgz
          if-no-files-found: error
          retention-days: 1
      - run: npm run test:sites

name: Verify FSY Operations

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run tests
        run: npm test 2>&1 | tee test-output.txt
      - name: Upload failed test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fsy-kumasi-test-output
          path: test-output.txt
          if-no-files-found: error
          retention-days: 1
      - name: Upload verified frontend build
        uses: actions/upload-artifact@v4
        with:
          name: fsy-kumasi-frontend
          path: dist/client
          if-no-files-found: error
          retention-days: 7
      - run: npm run test:sites